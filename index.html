<!DOCTYPE html>

<html>
    <head>
        <link rel="icon" type="image/x-icon" href="favicon.png">
        <link rel="apple-touch-icon" sizes="400x400" href="favicon.png">
        <title>StandBy</title>
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-title" content="StandBy">
        <meta name="apple-mobile-web-app-status-bar-style" content="black">
        <meta name="apple-mobile-web-app-orientation" content="landscape">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="theme-color" content="#000000">

        <style>
            @font-face {
                font-family: "RobotoMono";
                src: url("RobotoMono.woff2") format("woff2"), 
                       url(RobotoMono.ttf) format("truetype");
                font-weight: normal;
                font-style: normal;
                font-display:swap;
            }
            * {
                font-family: "RobotoMono", monospace;
                user-select: none;
                -webkit-user-select: none;
                -ms-user-select: none;
                -moz-user-select: none;
                -webkit-touch-callout: none;
                -webkit-tap-highlight-color: transparent;
            }
            html, body {
                height: 100%;
                margin: 0;
                overflow: hidden;
            }
            body {
                display: flex;
                justify-content: center;
                align-items: center;
                padding: 4px;
                background-color: black;
                font-family: "RobotoMono";
                color: #5fe4f9;
                flex-direction: row;
                height: 100%;
                visibility: hidden;
            }


            .h1-time {
                font-size: 18vh;
                line-height: 1;
                margin: 0 0.2em;
                -webkit-font-smoothing: antialiased;
                text-rendering: geometricPrecision
            }

            .colon {
                line-height: 1;
                margin-left: 0.4em;
                margin-right: 0.4em;
                margin-bottom: 0.25em;
                -webkit-font-smoothing: antialiased;
                text-rendering: geometricPrecision
            }

            .clock-container {
                font-family: "RobotoMono";
                display: flex;
                padding: 4px;
                background-color: black;
                color: #80f95f;
                justify-content: center;
                align-items: center;
                flex-direction: row;
                border: 3px solid gray;
                border-radius: 30px;
                padding: 1em 2em;
                margin-bottom: 2.5px;
                height: 50%;
                position:absolute;
            }

            .date-container {
                font-family: "RobotoMono";
                display: flex;
                padding: 4px;
                background-color: black;
                color: rgb(255,255,255);
                justify-content: center;
                align-items: center;
                flex-direction: row;
                padding: 1em 0;
                height: calc(25% - 2.5px);
                margin-bottom: 2.5px;
                border: 3px solid gray;
                border-radius: 30px;
            }

            .info-container {
                font-family: "RobotoMono";
                display: flex;
                align-items: center;
                justify-content: center;
                flex-direction: column;
                border: none;
                margin: 0 10px;
                cursor: grab;
                position: absolute;
                touch-action: none;
            }

            #reset {
                font-family: "RobotoMono";
                position: fixed;
                border: none;
                color: gray;
                background-color: black;
                text-decoration: underline;
                bottom: 2%;
                cursor: pointer;
            }

            .weather-container {
                font-family: "RobotoMono";
                display: flex;
                padding: 4px;
                background-color: black;
                color: rgb(255,255,255);
                justify-content: center;
                align-items: center;
                flex-direction: row;
                height: calc(25% - 2.5px);
                padding: 1em 0.1em;
                margin-top: 2.5px;
                border: 3px solid gray;
                border-radius: 30px;
            }

            .weather-container, .date-container {
                width: 100%;
            }

        </style>
    </head>
    <body>
        <input type="button" value="Reset all settings" onclick="reset()" id="reset">
        <div id="clock-container" class="clock-container">
            <h1 class="h1-time" id="hour">--</h1>
            <h1 class="h1-time colon">:</h1>
            <h1 class="h1-time" id="minute">--</h1>
        </div>
        <div id="info-container" class="info-container">
            <div class="date-container" id="date-container">
                <h1 id="weekday" style="color: #80f95f">Sun</h1>
                <h1>&nbsp</h1>
                <h2 id="month">Jan</h2>
                <h2>&nbsp</h2>
                <h2 id="day">01</h2>
            </div>
            <div class="weather-container" id="weather-container">
                <h1 id="temp" style="color:#80f95f">--°C</h1>
                <h1>&nbsp&nbsp</h1>
                <h1 id="code">--</h1>
            </div>
        </div>
        <script>
            const info_container_box = document.getElementById("info-container");
            let icOffSetX = 0;
            let icOffSetY = 0;
            let isDown = false;
            let icHasBeenMoved = false;

            let interval;
            interval = setInterval(() => {}, 60000); // This is just to prevent lock up if the window gets immediately minimized, so clearInterval(); works
            document.addEventListener("visibilitychange", () => {
                if (!document.hidden) {
                    const currentTime = new Date();
                    updateTime();
                    const delay = (60 - currentTime.getSeconds()) * 1000 - currentTime.getMilliseconds();
                    setTimeout(() => {
                        clearInterval(interval);
                        interval = setInterval(updateTime, 60000);
                    }, delay);
                }
            });

            info_container_box.addEventListener(
                "pointerdown",e => {
                    isDown = true;
                    icOffSetX = e.clientX - info_container_box.offsetLeft;
                    icOffSetY = e.clientY - info_container_box.offsetTop;
                    if (info_container_box.setPointerCapture && e.pointerId != undefined) {
                        try {
                            info_container_box.setPointerCapture(e.pointerId);
                        } catch (_) {
                            
                        }
                    }
                    info_container_box.style.cursor = "grabbing";
                }
            );

            document.addEventListener("pointermove", e => {
                if (!isDown) return;
                icHasBeenMoved = true;
                info_container_box.style.left = `${e.clientX - icOffSetX}px`
                info_container_box.style.top = `${e.clientY - icOffSetY}px`
            });

            document.addEventListener("pointerup", e => {
                if (!isDown) return;
                isDown = false;
                info_container_box.style.cursor = "grab";
                if (info_container_box.releasePointerCapture && e.pointerId != undefined) {
                    try {
                        info_container_box.releasePointerCapture(e.pointerId);
                    } catch (_) {}
                }
                const rect = info_container_box.getBoundingClientRect();

                const icCoordinates = {
                    "x": rect.left,
                    "y": rect.top
                }
                localStorage.setItem("icCoordinates", JSON.stringify(icCoordinates));
            });

            function getClockHeight() {
                const clockEl = document.getElementById("clock-container");
                return clockEl.offsetHeight;
            }

            function getClockWidth() {
                const clockEl = document.getElementById("clock-container");
                return clockEl.offsetWidth;
            }

            const info = document.getElementById("info-container");
            const date_con = document.getElementById("date-container");

            function position_cc() {
                const clockEl = document.getElementById("clock-container");
                
                const target_x = (window.innerWidth / 2 - clockEl.offsetWidth / 2) + 'px';
                const target_y = (window.innerHeight / 2 - clockEl.offsetHeight / 2) + 'px';

                clockEl.style.left = target_x;
                clockEl.style.top = target_y;
            }
            
            function position_info_container() {
                const icEl = document.getElementById("info-container");
                const icCoordinates = localStorage.getItem("icCoordinates");
                if (icCoordinates) {
                    icEl.style.top = JSON.parse(icCoordinates).y + 'px';
                    icEl.style.left = JSON.parse(icCoordinates).x + 'px';
                } else {
                    const cc = document.getElementById("clock-container");
                    const ic = document.getElementById("info-container");

                    const rect = cc.getBoundingClientRect();
                    
                    const target_x = rect.width / 2 + rect.left;
                    const target_y = rect.height / 2 + rect.top;
        
                    ic.style.left = target_x;
                    ic.style.top = target_y; 
                }
            }

            window.addEventListener("resize", () => {
                position_cc();
                position_info_container();
            });

            function updateTime() {
                const hourEl = document.getElementById("hour");
                const minuteEl = document.getElementById("minute");
                const monthEl = document.getElementById('month');
                const dayEl = document.getElementById('day');
                const weekdayEl = document.getElementById('weekday');
                const now = new Date();
                let hour = now.getHours();
                let minute = now.getMinutes();

                hour = hour.toString().padStart(2,'0');
                minute = minute.toString().padStart(2,'0');

                hourEl.textContent = hour;
                minuteEl.textContent = minute;

                const months = [
                    'Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'
                ];
                const weekdays = [
                    'Sun','Mon','Tue','Wed','Thu','Fri','Sat'
                ];

                let month = months[now.getMonth()];
                let day = now.getDate().toString().padStart(2,'0');
                let weekday = weekdays[now.getDay()];

                monthEl.textContent = month;
                dayEl.textContent = day;
                weekdayEl.textContent = weekday;;
            }

            function startClock()  {
                updateTime();
                const timeNow = new Date();
                const delay = (60 - timeNow.getSeconds()) * 1000 - timeNow.getMilliseconds();
                setTimeout(() => {
                    updateTime();
                    interval = setInterval(() => {
                        updateTime();
                        position_cc();
                        position_info_container();
                    }, 60000);
                }, delay
                )
            }

            function reset() {
                localStorage.removeItem("icCoordinates");
                window.location.reload();
            }

            function showPosition(position) {
                const codes = { 0: "clear", 1: "mostly clear", 2: "partly cloudy", 3: "overcast", 45: "foggy", 48: "foggy", 51: "light drizzle", 61: "rain", 80: "rain showers", 95: "thunderstorm" };
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;

                fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`)
                .then(res => res.json())
                .then(data => {
                    console.log(data);
                    const tempEl = document.getElementById("temp");
                    const codeEl = document.getElementById("code");

                    tempEl.textContent = `${data.current_weather.temperature}°C`;
                    if (codes[data.current_weather.weathercode] !== undefined) {
                        codeEl.textContent = codes[data.current_weather.weathercode];
                    } else {
                        codeEl.textContent = "unknown";
                    }

                })
                .catch(err => console.error(err));
                return data;
            }

            function showError(error) {
                switch(error.code) {
                    case error.PERMISSION_DENIED:
                        alert("Location permission has been denied. Please grant permission");
                        break;
                    case error.POSITION_UNAVAILABLE:
                        alert("User denied the request for Geolocation");
                        break
                    case error.TIMEOUT:
                        alert("Request timeout");
                        break;
                    case error.UNKNOWN_ERROR:
                        alert("An unknown error occured");
                        break;
                }
            }

            function getLocation() {
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(showPosition, showError);
                } else {
                    alert("Geolocation is not supported by your browser.");
                }
            }

            function wc_setWidth() {
                const dcEl = document.getElementById("date-container");
                const wcEl = document.getElementById("weather-container");

                wcEl.style.width = dcEl.clientWidth + 'px';
            }

            updateTime();
            startClock();
            document.fonts.ready.then(() => {
                position_cc();
                position_info_container();
                getLocation();
                document.body.style.visibility = 'visible';
            })
            console.log(getClockHeight());
            console.log(window.innerHeight);
            console.log(window.innerWidth);

            </script>
    </body>
</html>

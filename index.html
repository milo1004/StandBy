<!DOCTYPE html>

<html>
    <head>
        <title>StandBy</title>
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-title" content="StandBy">
        <meta name="apple-mobile-web-app-status-bar-style" content="black">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
        <style>
            @font-face {
                font-family: "RobotoMono";
                src: url("RobotoMono.woff2") format("woff2"), 
                       url(RobotoMono.ttf) format("TrueType");
                font-weight: normal;
                font-style: normal;
                font-display:swap;
            }
            * {
                font-family: "RobotoMono", monospace;
            }
            html, body {
                height: 100%;
                margin: 0;
                overflow: hidden;
            }
            body {
                display: flex;
                justify-content: center;
                align-items: center;
                padding: 4px;
                background-color: black;
                font-family: "RobotoMono";
                color: #5fe4f9;
                flex-direction: row;
                height: 100%;
            }


            .h1-time {
                font-size: 18vh;
                line-height: 1;
                margin: 0 0.2em;
                -webkit-font-smoothing: antialiased;
                text-rendering: geometricPrecision
            }

            .clock-container {
                font-family: "RobotoMono";
                display: flex;
                padding: 4px;
                background-color: black;
                color: #80f95f;
                justify-content: center;
                align-items: center;
                flex-direction: row;
                border: 3px solid gray;
                border-radius: 30px;
                padding: 1em 2em;
                margin-bottom: 2.5px;
                height: 50%;
            }

            .date-container {
                font-family: "RobotoMono";
                display: flex;
                padding: 4px;
                background-color: black;
                color: rgb(255,255,255);
                justify-content: center;
                align-items: center;
                flex-direction: row;
                border: 3px solid gray;
                border-radius: 30px;
                padding: 1em 2em;
                height: calc(25% - 2.5px);
            }

            .info-container {
                font-family: "RobotoMono";
                display: flex;
                align-items: center;
                justify-content: center;
                flex-direction: column;
                border: none;
                margin: 0 10px;
            }

        </style>
    </head>
    <body>
        <div id="clock-container" class="clock-container">
            <h1 class="h1-time" id="hour">00</h1>
            <h1 class="h1-time">:</h1>
            <h1 class="h1-time" id="minute">00</h1>
        </div>
        <div id="info-container" class="info-container">
            <div class="date-container" id="date-container">
                <h1 id="weekday" style="color: #80f95f">Sun</h1>
                <h1>&nbsp</h1>
                <h2 id="month">Jan</h2>
                <h2>&nbsp</h2>
                <h2 id="day">01</h2>
            </div>
        </div>
        <script>
            function getClockHeight() {
                const clockEl = document.getElementById("clock-container");
                return clockEl.offsetHeight;
            }

            const info = document.getElementById("info-container");
            const date_con = document.getElementById("date-container");
            info.style.height = getClockHeight() + 'px';
                
            function updateTime() {
                const hourEl = document.getElementById("hour");
                const minuteEl = document.getElementById("minute");
                const monthEl = document.getElementById('month');
                const dayEl = document.getElementById('day');
                const weekdayEl = document.getElementById('weekday');
                const now = new Date();
                let hour = now.getHours();
                let minute = now.getMinutes();

                hour = hour.toString().padStart(2,'0');
                minute = minute.toString().padStart(2,'0');

                hourEl.textContent = hour;
                minuteEl.textContent = minute;

                const months = [
                    'Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'
                ];
                const weekdays = [
                    'Sun','Mon','Tue','Wed','Thur','Fri','Sat'
                ];

                let month = months[now.getMonth()];
                let day = now.getDate().toString().padStart(2,'0');
                let weekday = weekdays[now.getDay()];

                monthEl.textContent = month;
                dayEl.textContent = day;
                weekdayEl.textContent = weekday;
            }

            function startClock()  {
                updateTime();
                const timeNow = new Date();
                const delay = (60 - timeNow.getSeconds()) * 1000 - timeNow.getMilliseconds();
                setTimeout(() => {
                    updateTime();
                    setInterval(updateTime, 60000)
                }, delay
                )
            }
            updateTime();
            startClock();
            console.log(getClockHeight());
        </script>
    </body>
</html>
